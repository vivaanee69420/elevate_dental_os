name: Sentry Release

on:
  push:
    branches:
      - main

jobs:
  sentry-release:
    name: Create Sentry Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Full history needed for --auto commit association

      - name: Create Sentry Release
        # SHA-pinned (was @v1, a mutable tag) — this job holds SENTRY_AUTH_TOKEN.
        uses: getsentry/action-release@f6dfa3d84a1c740b94aa45255c5e032b744a095d # v1.9.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: plan4growth
          SENTRY_PROJECT: node
        with:
          environment: production
